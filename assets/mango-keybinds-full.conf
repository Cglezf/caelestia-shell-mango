# Optional full Caelestia-style profile for Mango. Do not combine with the minimal profile.
# Use install.sh to check or replace conflicting bindings with a backed-up local snapshot.
# Workspace 10 requires tag_num >= 10. Groups stay within the configured tag count (Mango max: 31).
key_mode=default

bindr=SUPER,Super_L,spawn,qs ipc -c caelestia call drawers toggle launcher
bindr=SUPER,Super_R,spawn,qs ipc -c caelestia call drawers toggle launcher
bind=SUPER,space,spawn,qs ipc -c caelestia call drawers toggle launcher

# Workspace slots and groups
bind=SUPER,1,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 1
bind=SUPER+ALT,1,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 1
bind=SUPER+CTRL,1,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 1
bind=SUPER+CTRL+ALT,1,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 1
bind=SUPER,2,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 2
bind=SUPER+ALT,2,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 2
bind=SUPER+CTRL,2,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 2
bind=SUPER+CTRL+ALT,2,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 2
bind=SUPER,3,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 3
bind=SUPER+ALT,3,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 3
bind=SUPER+CTRL,3,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 3
bind=SUPER+CTRL+ALT,3,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 3
bind=SUPER,4,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 4
bind=SUPER+ALT,4,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 4
bind=SUPER+CTRL,4,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 4
bind=SUPER+CTRL+ALT,4,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 4
bind=SUPER,5,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 5
bind=SUPER+ALT,5,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 5
bind=SUPER+CTRL,5,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 5
bind=SUPER+CTRL+ALT,5,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 5
bind=SUPER,6,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 6
bind=SUPER+ALT,6,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 6
bind=SUPER+CTRL,6,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 6
bind=SUPER+CTRL+ALT,6,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 6
bind=SUPER,7,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 7
bind=SUPER+ALT,7,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 7
bind=SUPER+CTRL,7,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 7
bind=SUPER+CTRL+ALT,7,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 7
bind=SUPER,8,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 8
bind=SUPER+ALT,8,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 8
bind=SUPER+CTRL,8,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 8
bind=SUPER+CTRL+ALT,8,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 8
bind=SUPER,9,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 9
bind=SUPER+ALT,9,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 9
bind=SUPER+CTRL,9,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 9
bind=SUPER+CTRL+ALT,9,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 9
bind=SUPER,0,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus slot 10
bind=SUPER+ALT,0,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move slot 10
bind=SUPER+CTRL,0,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus group 10
bind=SUPER+CTRL+ALT,0,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move group 10
bind=SUPER,Page_Down,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus relative 1
bind=SUPER,Page_Up,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus relative -1
bind=SUPER+ALT,Page_Down,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move relative 1
bind=SUPER+ALT,Page_Up,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move relative -1
bind=SUPER+CTRL,Right,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus relative 1
bind=SUPER+CTRL,Left,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus relative -1
bind=SUPER+CTRL+SHIFT,Right,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move relative 1
bind=SUPER+CTRL+SHIFT,Left,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move relative -1
axisbind=SUPER,DOWN,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus relative 1
axisbind=SUPER,UP,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus relative -1
axisbind=SUPER+ALT,DOWN,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move relative 1
axisbind=SUPER+ALT,UP,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace move relative -1
axisbind=SUPER+CTRL,DOWN,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus relative 10
axisbind=SUPER+CTRL,UP,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py workspace focus relative -10
bind=SUPER+ALT,s,tagsilent,0
bind=SUPER+CTRL+SHIFT,Up,tagsilent,0
bind=SUPER+CTRL+SHIFT,Down,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py special-out

# Window groups and actions
bind=ALT,Tab,groupfocus,next
bind=ALT+SHIFT,Tab,groupfocus,prev
bind=ALT+CTRL,Tab,focusstack,next
bind=ALT+CTRL+SHIFT,Tab,focusstack,prev
bind=SUPER,u,groupleave
bind=SUPER,comma,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py group-toggle
bind=SUPER,Left,focusdir,left
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+ALT,Left,move_client,left
bind=SUPER,Right,focusdir,right
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+ALT,Right,move_client,right
bind=SUPER,Up,focusdir,up
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+ALT,Up,move_client,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+ALT,Down,move_client,down
bind=SUPER,minus,move_client,left
bind=SUPER,equal,move_client,right
bind=SUPER+SHIFT,minus,move_client,up
bind=SUPER+SHIFT,equal,move_client,down
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
bind=SUPER+CTRL,backslash,centerwin
bind=SUPER+CTRL+ALT,backslash,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py normalize
bind=SUPER+ALT,backslash,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py pip
bind=SUPER,p,toggleglobal
bind=SUPER,f,togglefullscreen
bind=SUPER+ALT,f,togglemaximizescreen
bind=SUPER+ALT,space,togglefloating
bind=SUPER,q,killclient
bind=SUPER,s,toggle_special_tag

# Named scratchpad alternatives (single app, not a named multi-window workspace)
bind=CTRL+SHIFT,Escape,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py scratchpad sysmon
bind=SUPER,m,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py scratchpad music
bind=SUPER,d,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py scratchpad communication
bind=SUPER,r,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py scratchpad todo

# Applications
bind=SUPER,t,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py app terminal
bind=SUPER,w,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py app browser
bind=SUPER,c,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py app editor
bind=SUPER,e,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py app files
bind=CTRL+ALT,v,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py app audio

# Utilities
bind=NONE,Print,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py screenshot
bind=SUPER+SHIFT,s,spawn,qs ipc -c caelestia call picker openFreeze
bind=SUPER+SHIFT+ALT,s,spawn,qs ipc -c caelestia call picker open
bind=CTRL+ALT,r,spawn,qs ipc -c caelestia call recorder toggle screen
bind=SUPER+ALT,r,spawn,qs ipc -c caelestia call recorder toggle sound
bind=SUPER+SHIFT+ALT,r,spawn,qs ipc -c caelestia call recorder toggle region
bind=SUPER+SHIFT,c,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py colour

# Media
bind=SUPER+CTRL,space,spawn,qs ipc -c caelestia call mpris playPause
bind=SUPER+CTRL,equal,spawn,qs ipc -c caelestia call mpris next
bind=SUPER+CTRL,minus,spawn,qs ipc -c caelestia call mpris previous
bind=SUPER+CTRL,BackSpace,spawn,qs ipc -c caelestia call mpris stop
bind=SUPER+SHIFT,m,spawn,qs ipc -c caelestia call audio mute

# Shell and clipboard
bind=CTRL+ALT,Delete,spawn,qs ipc -c caelestia call drawers toggle session
bind=SUPER,n,spawn,qs ipc -c caelestia call drawers toggle sidebar
bind=CTRL+ALT,c,spawn,qs ipc -c caelestia call notifs clear
bind=SUPER,k,spawn,qs ipc -c caelestia call shortcuts trigger showall
bind=SUPER,l,spawn,qs ipc -c caelestia call lock lock
bind=SUPER+SHIFT,l,spawn,systemctl suspend
bind=SUPER,v,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py clipboard
bind=SUPER+ALT,v,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py clipboard-delete
bind=CTRL+SHIFT+ALT,v,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py clipboard-latest
bind=SUPER,period,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py emoji
bindr=SUPER+CTRL+ALT,r,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py restart
bindr=SUPER+CTRL+SHIFT,r,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py kill

# Extra shell drawers, moved away from the original ungroup/communication keys
bind=SUPER,b,spawn,qs ipc -c caelestia call drawers toggle dashboard
bind=SUPER,y,spawn,qs ipc -c caelestia call drawers toggle utilities

# Mango-native layout and column controls. Column conversion requires scroller.
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down
bind=ALT,x,switch_proportion_preset
bind=ALT,e,set_proportion,1.0
bind=SUPER+CTRL,Tab,switch_layout
bind=SUPER+CTRL+SHIFT,1,setlayout,scroller
bind=SUPER+CTRL+SHIFT,2,setlayout,tile
bind=SUPER+CTRL+SHIFT,3,setlayout,dwindle
bind=SUPER+CTRL+SHIFT,4,setlayout,monocle
bind=SUPER+CTRL,o,toggleoverview
bind=SUPER+CTRL,F5,reload_config
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50

# Laptop hardware keys (no Super modifier).
bind=NONE,XF86MonBrightnessUp,spawn,qs ipc -c caelestia call shortcuts trigger brightnessUp
bind=NONE,XF86MonBrightnessDown,spawn,qs ipc -c caelestia call shortcuts trigger brightnessDown
bind=NONE,XF86AudioRaiseVolume,spawn,qs ipc -c caelestia call audio increase
bind=NONE,XF86AudioLowerVolume,spawn,qs ipc -c caelestia call audio decrease
bind=NONE,XF86AudioMute,spawn,qs ipc -c caelestia call audio mute
bind=NONE,XF86AudioMicMute,spawn,qs ipc -c caelestia call audio muteMic
bind=NONE,XF86AudioPlay,spawn,qs ipc -c caelestia call mpris playPause
bind=NONE,XF86AudioNext,spawn,qs ipc -c caelestia call mpris next
bind=NONE,XF86AudioPrev,spawn,qs ipc -c caelestia call mpris previous
bind=NONE,XF86AudioStop,spawn,qs ipc -c caelestia call mpris stop
bind=NONE,XF86KbdBrightnessUp,spawn,brightnessctl --device='*::kbd_backlight' set +10%
bind=NONE,XF86KbdBrightnessDown,spawn,brightnessctl --device='*::kbd_backlight' set 10%-
bind=NONE,XF86KbdLightOnOff,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py keyboard-light

# Floating keyboard shortcut sheet.
bind=SUPER,slash,spawn,qs ipc -c caelestia call keybindings toggle
window_rule=title:^Caelestia Keybindings$,is_floating:1

# Notify the shell after native/manual/automatic compositor reloads.
exec=qs ipc -c caelestia call mango configReloaded
