# Source this file from your Mango config.conf after your other bindings.
# Calls the installed Caelestia shell directly; caelestia-cli is optional.
key_mode=default

# Open the launcher on Super release or Super+Space.
bindr=SUPER,Super_L,spawn,qs ipc -c caelestia call drawers toggle launcher
bindr=SUPER,Super_R,spawn,qs ipc -c caelestia call drawers toggle launcher
bind=SUPER,space,spawn,qs ipc -c caelestia call drawers toggle launcher

bind=SUPER,d,spawn,qs ipc -c caelestia call drawers toggle dashboard
bind=SUPER,u,spawn,qs ipc -c caelestia call drawers toggle utilities
bind=SUPER,l,spawn,qs ipc -c caelestia call lock lock

# Other shell features (all use native Quickshell IPC).
bind=SUPER,a,spawn,qs ipc -c caelestia call drawers toggle sidebar
bind=SUPER,Escape,spawn,qs ipc -c caelestia call drawers toggle session
bind=SUPER+SHIFT,s,spawn,qs ipc -c caelestia call picker open
bind=SUPER+CTRL,s,spawn,qs ipc -c caelestia call picker openClip
bind=SUPER+SHIFT,g,spawn,qs ipc -c caelestia call gameMode toggle
bind=SUPER+SHIFT,n,spawn,qs ipc -c caelestia call nexus open
bind=SUPER+CTRL,i,spawn,qs ipc -c caelestia call idleInhibitor toggle
bind=SUPER+CTRL,space,toggle_special_tag

# Laptop hardware keys (no Super modifier).
bind=NONE,XF86MonBrightnessUp,spawn,qs ipc -c caelestia call shortcuts trigger brightnessUp
bind=NONE,XF86MonBrightnessDown,spawn,qs ipc -c caelestia call shortcuts trigger brightnessDown
bind=NONE,XF86AudioRaiseVolume,spawn,qs ipc -c caelestia call audio increase
bind=NONE,XF86AudioLowerVolume,spawn,qs ipc -c caelestia call audio decrease
bind=NONE,XF86AudioMute,spawn,qs ipc -c caelestia call audio mute
bind=NONE,XF86AudioMicMute,spawn,qs ipc -c caelestia call audio muteMic
bind=NONE,XF86AudioPlay,spawn,qs ipc -c caelestia call mpris playPause
bind=NONE,XF86AudioNext,spawn,qs ipc -c caelestia call mpris next
bind=NONE,XF86AudioPrev,spawn,qs ipc -c caelestia call mpris previous
bind=NONE,XF86AudioStop,spawn,qs ipc -c caelestia call mpris stop
bind=NONE,XF86KbdBrightnessUp,spawn,brightnessctl --device='*::kbd_backlight' set +10%
bind=NONE,XF86KbdBrightnessDown,spawn,brightnessctl --device='*::kbd_backlight' set 10%-
bind=NONE,XF86KbdLightOnOff,spawn,python3 /etc/xdg/quickshell/caelestia/assets/mango-actions.py keyboard-light

# Floating keyboard shortcut sheet.
bind=SUPER,slash,spawn,qs ipc -c caelestia call keybindings toggle
window_rule=title:^Caelestia Keybindings$,is_floating:1

# Notify the shell after native/manual/automatic compositor reloads.
exec=qs ipc -c caelestia call mango configReloaded
